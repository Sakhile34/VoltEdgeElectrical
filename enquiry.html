<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - VoltEdge Electrical</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <h1>VoltEdge Electrical</h1>
        <p>Reliable Electrical Solutions in Mbombela</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- Main Content -->
    <main>

        <section>
            <h2>Make an Enquiry</h2>
            <p>
                Interested in our services? Fill in the form below and we
                will get back to you as soon as possible.
            </p>

            <form>
                <label for="name">Full Name</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email Address</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number</label><br>
                <input type="tel" id="phone" name="phone"><br><br>

                <label for="service">Service Interested In</label><br>
                <select id="service" name="service">
                    <option value="installation">Electrical Installation</option>
                    <option value="repair">Electrical Repair</option>
                    <option value="maintenance">Maintenance</option>
                    <option value="fault">Fault Finding</option>
                    <option value="solar">Solar Installation</option>
                </select><br><br>

                <label for="message">Message</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 VoltEdge Electrical. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
